name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        env:
          REACT_APP_CONTENTFUL_SPACE: ${{ secrets.REACT_APP_CONTENTFUL_SPACE }}
          REACT_APP_CONTENTFUL_ENV: ${{ secrets.REACT_APP_CONTENTFUL_ENV }}
          REACT_APP_CONTENTFUL_TOKEN: ${{ secrets.REACT_APP_CONTENTFUL_TOKEN }}
          REACT_APP_CONTENTFUL_GET_THEME: ${{ secrets.REACT_APP_CONTENTFUL_GET_THEME }}
          REACT_APP_CONTENTFUL_GET_INFO: ${{ secrets.REACT_APP_CONTENTFUL_GET_INFO }}
          REACT_APP_CONTENTFUL_GET_TOOL: ${{ secrets.REACT_APP_CONTENTFUL_GET_TOOL }}
          REACT_APP_CONTENTFUL_GET_PORTFOLIO: ${{ secrets.REACT_APP_CONTENTFUL_GET_PORTFOLIO }}
          REACT_APP_CONTENTFUL_GET_DESKTOP: ${{ secrets.REACT_APP_CONTENTFUL_GET_DESKTOP }}
          REACT_APP_CONTENTFUL_GET_NOTES: ${{ secrets.REACT_APP_CONTENTFUL_GET_NOTES }}
        run: yarn workspace @gabrielramos/frontend build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
